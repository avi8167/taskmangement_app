<!DOCTYPE html>
<html>

<head>
    <title>Task Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Task Management</h1>


        <!-- ================= CREATE TASK ================= -->

        <div class="section">

            <h2>Create Task</h2>

            <input
                type="text"
                id="title"
                placeholder="Enter task title"
            >

            <input
                type="text"
                id="description"
                placeholder="Enter description"
            >

            <!-- Boolean value -->
            <label>
                <input
                    type="checkbox"
                    id="is_complete"
                >
                Completed
            </label>

            <br>

            <button onclick="create()">
                Add Task
            </button>

        </div>


        <!-- ================= GET ONE TASK ================= -->

        <div class="section">

            <h2>Find Task</h2>

            <input
                type="number"
                id="taskId"
                placeholder="Enter Task ID"
            >

            <button onclick="getOneTask()">
                Get Task
            </button>

            <div id="oneTask"></div>

        </div>


        <!-- ================= UPDATE TASK ================= -->

        <div class="section">

            <h2>Update Task</h2>

            <input
                type="number"
                id="updateId"
                placeholder="Task ID"
            >

            <input
                type="text"
                id="updateTitle"
                placeholder="New title"
            >

            <input
                type="text"
                id="updateDescription"
                placeholder="New description"
            >

            <label>
                <input
                    type="checkbox"
                    id="updateIsComplete"
                >
                Completed
            </label>

            <br>

            <button onclick="updateTask()">
                Update Task
            </button>

        </div>


        <!-- ================= DELETE TASK ================= -->

        <div class="section">

            <h2>Delete Task</h2>

            <input
                type="number"
                id="deleteId"
                placeholder="Enter Task ID"
            >

            <button onclick="deleteTask()">
                Delete Task
            </button>

        </div>


        <!-- ================= ALL TASKS ================= -->

        <div class="section">

            <h2>All Tasks</h2>

            <button onclick="getTasks()">
                Get Tasks
            </button>

            <div id="taskList"></div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
